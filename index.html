<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Pasfoto Banser Nyata (Realistis)</title>
  <style>
    body { background: #f0f2f5; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
    .pasfoto-card-jumbo { background: #ffffff; max-width: 600px; width: 100%; border-radius: 20px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12); padding: 30px; box-sizing: border-box; text-align: center; margin-top: 10px; }
    .pasfoto-header-jumbo h2 { color: #1b4d3e; font-size: 24px; font-weight: 900; margin: 0 0 10px 0; line-height: 1.4; }
    .pasfoto-header-jumbo p { color: #57606f; font-size: 13px; margin: 0 0 25px 0; line-height: 1.6; }
    .pasfoto-controls-jumbo { text-align: left; margin-bottom: 25px; background: #f1f2f6; padding: 12px; border-radius: 12px; box-sizing: border-box; }
    .pasfoto-controls-jumbo label { display: block; font-size: 13px; font-weight: 800; color: #2c3e50; margin-bottom: 6px; }
    .pasfoto-controls-jumbo select { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 14px; font-weight: bold; color: #2c3e50; }
    .pasfoto-frame-wrapper { display: inline-block; background: #ffffff; padding: 10px; border-radius: 16px; border: 3px dashed #747d8c; margin-bottom: 25px; }
    
    /* Ukuran Lembar Pasfoto Standar */
    .frame-jumbo-3x4 { position: relative; width: 340px; height: 453px; background: #db2725; overflow: hidden; border-radius: 12px; }
    .frame-jumbo-4x6 { position: relative; width: 340px; height: 510px; background: #db2725; overflow: hidden; border-radius: 12px; }
    
    /* Lapisan Wajah Berada di Belakang */
    #wajahPenggunaTampil { position: absolute; top: 0px; left: 0px; width: 100%; height: auto; z-index: 5; display: none; pointer-events: none; }
    
    /* Lapisan Foto Seragam Asli yang Bisa Digeser Bebas Menggunakan Jari/Mouse */
    #seragamBanserTampil { position: absolute; top: 160px; left: 0px; width: 100%; height: auto; z-index: 10; cursor: move; display: none; }
    
    #teksPetunjuk { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffffff; font-weight: bold; font-size: 15px; width: 90%; z-index: 1; text-shadow: 1px 1px 3px rgba(0,0,0,0.4); }
    
    /* Panel Kontrol Skala Lebar Seragam */
    .pasfoto-sliders-jumbo { margin-bottom: 25px; background: #f8f9fa; padding: 15px; border-radius: 12px; border: 1px solid #dcdde1; text-align: left; box-sizing: border-box; }
    .pasfoto-sliders-jumbo label { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 800; color: #2c3e50; }
    .pasfoto-sliders-jumbo input { width: 65%; }

    .pasfoto-actions-jumbo { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
    .file-input-jumbo-wrapper { background: #1b4d3e; padding: 15px; border-radius: 12px; color: white; text-align: center; }
    .file-input-jumbo-wrapper input { font-size: 14px; font-weight: 700; cursor: pointer; display: block; margin: 0 auto; }
    .btn-pasfoto-jumbo { width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; border: none; background: #e67e22; color: #ffffff; }
    .pasfoto-footer-jumbo { font-size: 12px; font-weight: 800; color: #57606f; border-top: 2px solid #f1f2f6; padding-top: 15px; }
    
    @media print {
      body * { visibility: hidden !important; background: none !important; }
      .id-area-cetak, .id-area-cetak * { visibility: visible !important; }
      .id-area-cetak { position: absolute !important; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important; width: 100% !important; display: flex !important; justify-content: center !important; }
      .pasfoto-card-jumbo { box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; }
      .no-print { display: none !important; }
      .pasfoto-frame-wrapper { border: none !important; padding: 0 !important; }
    }
  </style>
</head>
<body>

<div class="pasfoto-card-jumbo id-area-cetak">
  <div class="pasfoto-header-jumbo no-print">
    <h2>KAMI SIAP SUKSESKAN<br>EDIT PASFOTO BANSER AUTOMATIS</h2>
    <p>Silakan pilih foto Anda. Geser langsung foto seragam loreng asli dengan jari Anda ke atas/bawah/kiri/kanan agar posisinya pas.</p>
  </div>

  <!-- Menu Dropdown Pilihan Seragam Nyata -->
  <div class="pasfoto-controls-jumbo no-print">
    <label>🎨 PILIHAN SERAGAM ASLI:</label>
    <select id="seragamSelect" onchange="gantiAsetSeragam(this.value)">
      <option value="LORENG_BANSER">Seragam PDL Loreng Banser (Foto Asli)</option>
      <option value="JAS_ANSOR">Jas Resmi Ansor Hijau (Foto Asli)</option>
    </select>
    
    <label style="margin-top: 12px;">📐 UKURAN PASFOTO SAHABAT:</label>
    <select id="ukuranSelect" onchange="gantiUkuranPasfoto(this.value)">
      <option value="3x4">3 x 4 cm (Ukuran Standar Cetak)</option>
      <option value="4x6">4 x 6 cm (Ukuran Besar Cetak)</option>
    </select>
  </div>

  <div class="pasfoto-frame-wrapper">
    <div id="framePasfotoUtama" class="frame-jumbo-3x4">
      <!-- Lapisan Foto Wajah -->
      <img id="wajahPenggunaTampil" src="" alt=" ">
      
      <!-- LAPISAN FOTO SERAGAM LORENG ASLI (MURNI HASIL FOTO DARI KAMERA NYATA NYATA) -->
      <img id="seragamBanserTampil" src="https://ibb.co" alt="Seragam Banser">
      
      <div id="teksPetunjuk">FOTO WAJAH AKAN MUNCUL DI SINI</div>
    </div>
  </div>
  
  <!-- Slider Mengatur Lebar Seragam Loreng Asli -->
  <div class="pasfoto-sliders-jumbo no-print">
    <label>🔍 ATUR UKURAN SERAGAM NYATA: <input type="range" id="scaleSlider" min="50" max="250" value="100" oninput="ubahSkalaSeragam(this.value)"></label>
  </div>

  <div class="pasfoto-actions-jumbo no-print">
    <div class="file-input-jumbo-wrapper">
      <span style="display:block; margin-bottom:8px; font-weight:bold; font-size:14px;">📷 PILIH FOTO WAJAH SAHABAT:</span>
      <input type="file" id="uploadWajah" accept="image/*" onchange="prosesTampilFoto(event)">
    </div>
    <button type="button" onclick="window.print()" class="btn-pasfoto-jumbo">💾 DOWNLOAD HASIL FOTO (SIMPAN PDF)</button>
  </div>

  <div class="pasfoto-footer-jumbo no-print">BLOG AUTOMATION TOOL BY - TIO WATIO</div>
</div>

<script>
  // Tautan URL Gambar Potongan Seragam Hasil Kamera Asli Nyata
  const daftarSeragamAsli = {
    'LORENG_BANSER': 'https://ibb.co',
    'JAS_ANSOR': 'https://ibb.co'
  };

  let isDragging = false;
  let startX, startY;
  let currentX = 0;
  let currentY = 160; 

  const imgSeragam = document.getElementById('seragamBanserTampil');
  const frame = document.getElementById('framePasfotoUtama');

  function prosesTampilFoto(event) {
    const input = event.target;
    if (input.files && input.files[0]) {
      const imgWajah = document.getElementById('wajahPenggunaTampil');
      const teks = document.getElementById('teksPetunjuk');
      
      imgWajah.src = URL.createObjectURL(input.files[0]);
      imgWajah.style.display = 'block';
      imgSeragam.style.display = 'block';
      teks.style.display = 'none';
      
      // Reset letak seragam ke posisi pundak ideal
      currentX = 0;
      currentY = 160;
      imgSeragam.style.left = currentX + 'px';
      imgSeragam.style.top = currentY + 'px';
    }
  }

  // Fungsi mengganti jenis pakaian seragam hasil kamera asli
  function gantiAsetSeragam(kunci) {
    imgSeragam.src = daftarSeragamAsli[kunci];
  }

  function ubahSkalaSeragam(nilai) {
    if (imgSeragam.style.display === 'block') {
      imgSeragam.style.width = nilai + '%';
    }
  }

  // SISTEM NAVIGASI SENTUHAN JARI/MOUSE UNTUK PERGESERAN BEBAS INSTAN
  frame.addEventListener('mousedown', dragStart);
  window.addEventListener('mousemove', dragMove);
  window.addEventListener('mouseup', dragEnd);
  
  frame.addEventListener('touchstart', dragStart, { passive: false });
  window.addEventListener('touchmove', dragMove, { passive: false });
  window.addEventListener('touchend', dragEnd);

  function dragStart(e) {
    if (imgSeragam.style.display !== 'block') return;
    isDragging = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    startX = clientX - currentX;
    startY = clientY - currentY;
  }

  function dragMove(e) {
    if (!isDragging) return;
    e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    currentX = clientX - startX;
    currentY = clientY - startY;
    imgSeragam.style.left = currentX + 'px';
    imgSeragam.style.top = currentY + 'px';
  }

  function dragEnd() { isDragging = false; }

  function gantiUkuranPasfoto(pilihan) {
    if (pilihan === '4x6') { frame.className = 'frame-jumbo-4x6'; } 
    else { frame.className = 'frame-jumbo-3x4'; }
  }
</script>

</body>
</html>
